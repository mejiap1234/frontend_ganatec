<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">GANATEC</title>
  <desc id="desc">Ícono de GANATEC: cabeza de una res sobre campos verdes, símbolo de ganadería y tecnología.</desc>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d5a38"/>
      <stop offset="1" stop-color="#073b2e"/>
    </linearGradient>
    <linearGradient id="pelaje" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#e4a263"/>
      <stop offset="1" stop-color="#af6734"/>
    </linearGradient>
  </defs>

  <!-- Fondo de aplicación. Deja márgenes seguros para favicon y PWA. -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#fondo)"/>
  <circle cx="64" cy="61" r="46" fill="#f3f8e9"/>

  <!-- Paisaje ganadero en segundo plano. -->
  <path d="M20 79Q40 63 62 79Q85 64 108 78V96H20Z" fill="#9fcb5e"/>
  <path d="M20 91Q44 77 67 89Q90 76 108 88V103H20Z" fill="#5b9d48"/>

  <!-- Orejas y pequeños cuernos de la res. -->
  <path d="M47 41Q38 29 40 22Q49 23 55 36Z" fill="#d7b489" stroke="#704725" stroke-width="2" stroke-linejoin="round"/>
  <path d="M81 41Q90 29 88 22Q79 23 73 36Z" fill="#d7b489" stroke="#704725" stroke-width="2" stroke-linejoin="round"/>
  <path d="M46 47Q31 35 18 45Q19 61 46 64Z" fill="#a76236" stroke="#6c3c25" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M82 47Q97 35 110 45Q109 61 82 64Z" fill="#a76236" stroke="#6c3c25" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M41 49Q29 43 25 48Q31 55 42 56Z" fill="#e8a981"/>
  <path d="M87 49Q99 43 103 48Q97 55 86 56Z" fill="#e8a981"/>

