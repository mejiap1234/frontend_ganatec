  <path d="M44 42Q48 29 64 28Q80 29 84 42Q89 55 83 74L82 91Q77 106 64 108Q51 106 46 91L45 74Q39 55 44 42Z"
        fill="url(#pelaje)" stroke="#704525" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M60 31Q66 27 71 33Q70 46 76 59Q75 69 68 78L58 78Q54 67 57 58Q62 43 60 31Z" fill="#f8e8ca"/>
  <path d="M47 68Q52 62 59 67" fill="none" stroke="#80502d" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M69 67Q76 62 81 68" fill="none" stroke="#80502d" stroke-width="2.2" stroke-linecap="round"/>
  <ellipse cx="53" cy="69" rx="3.2" ry="3.8" fill="#222b25"/>
  <ellipse cx="75" cy="69" rx="3.2" ry="3.8" fill="#222b25"/>
  <circle cx="54" cy="68" r="1" fill="#fff"/>
  <circle cx="76" cy="68" r="1" fill="#fff"/>
  <path d="M48 80Q52 76 64 76Q76 76 80 80Q86 91 76 98Q64 104 52 98Q42 91 48 80Z"
        fill="#f0d5ae" stroke="#8b5a40" stroke-width="2"/>
  <ellipse cx="55" cy="86" rx="3.6" ry="2.5" fill="#6e5145"/>
  <ellipse cx="73" cy="86" rx="3.6" ry="2.5" fill="#6e5145"/>
  <path d="M58 95Q64 98 70 95" fill="none" stroke="#9b7360" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Hoja verde: vínculo entre campo y gestión inteligente. -->
